name: linter
 
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
 
jobs:
  linter-formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies
        run: make dev-deps
        
      - name: Run clang-format
        run: make lint-formatter
 
  linter-aggressive_flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies (Base)
        run: make dev-deps
        
      - name: Install LLVM 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          
      - name: Run aggressive linting with Clang 21
        run: make lint-aggressive CC=clang-21
 
  linter-cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install dependencies
        run: make dev-deps
        
      - name: Run cppcheck
        run: make lint-cppcheck
